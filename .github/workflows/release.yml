name: Release

# Pushing a version tag (for example v0.1.1) tests the package, publishes it to npm and creates a GitHub release
# with automatically generated notes.
#
# npm publishing uses trusted publishing (OIDC), so no npm token is stored in this repository. Set it up once on
# npmjs.com: the package's Settings -> Trusted Publisher -> GitHub Actions, with this repository and the workflow
# filename release.yml.

on:
  push:
    tags: ["v*"]
  # Manual runs check the workflow itself (setup, tests, packaging) without publishing or creating a release.
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm CLI.
      - run: npm install -g npm@latest

      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm test

      - name: Check the package contents
        run: npm pack --dry-run

      - name: Publish to npm
        if: github.ref_type == 'tag'
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm, skipping publish"
          else
            npm publish
          fi

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          case "$GITHUB_REF_NAME" in
            *-*) FLAGS="--prerelease" ;;
          esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag $FLAGS
          fi
